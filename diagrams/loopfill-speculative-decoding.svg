<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 430" role="img" aria-label="LoopFill speculative decoding workflow"><defs><marker id="arrow-01-1-0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#777777"/></marker><marker id="arrow-01-1-1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C00000"/></marker></defs><rect x="15" y="175" width="120" height="70" rx="1" fill="#F3F3F3" stroke="#999999" stroke-width="0.9"/><text x="75.0" y="204.475" text-anchor="middle" font-size="17" style="fill:#1D1D1A;font-weight:700"><tspan x="75.0" dy="0">Verified</tspan><tspan x="75.0" dy="22.950000000000003">Prefix</tspan></text><rect x="190" y="20" width="215" height="90" rx="1" fill="#EDF2F6" stroke="#999999" stroke-width="0.9"/><text x="297.5" y="50.99999999999999" text-anchor="middle" font-size="14" style="fill:#1D1D1A;font-weight:400"><tspan x="297.5" dy="0">Local + Global Suffix Trees</tspan><tspan x="297.5" dy="18.900000000000002">Multi-token drafts · Q = 4</tspan><tspan x="297.5" dy="18.900000000000002">Match up to 64 tokens</tspan></text><rect x="190" y="160" width="215" height="90" rx="1" fill="#F8EDEC" stroke="#C00000" stroke-width="0.9"/><text x="297.5" y="189.0" text-anchor="middle" font-size="16" style="fill:#1D1D1A;font-weight:700"><tspan x="297.5" dy="0">Unified Draft Tree</tspan><tspan x="297.5" dy="21.6">Shared-prefix merge</tspan><tspan x="297.5" dy="21.6">Bidirectional expansion</tspan></text><rect x="450" y="160" width="170" height="90" rx="1" fill="#FFFFFF" stroke="#999999" stroke-width="0.9"/><text x="535.0" y="191.0" text-anchor="middle" font-size="14" style="fill:#1D1D1A;font-weight:400"><tspan x="535.0" dy="0">Path Scoring</tspan><tspan x="535.0" dy="18.900000000000002">s(v) = s(parent)·w(v)</tspan><tspan x="535.0" dy="18.900000000000002">Keep Top-N · N = 16</tspan></text><rect x="665" y="140" width="220" height="120" rx="1" fill="#EDF2F6" stroke="#999999" stroke-width="0.9"/><text x="775.0" y="174.875" text-anchor="middle" font-size="15" style="fill:#1D1D1A;font-weight:700"><tspan x="775.0" dy="0">Shared Transformer Block</tspan><tspan x="775.0" dy="20.25">One batched pass</tspan><tspan x="775.0" dy="20.25">Different tokens + depths</tspan><tspan x="775.0" dy="20.25">≤ N+1 slots / request</tspan></text><rect x="930" y="140" width="210" height="120" rx="1" fill="#F8EDEC" stroke="#C00000" stroke-width="0.9"/><text x="1035.0" y="184.0" text-anchor="middle" font-size="16" style="fill:#1D1D1A;font-weight:700"><tspan x="1035.0" dy="0">Full-depth Verification</tspan><tspan x="1035.0" dy="21.6">Depth T → Coda</tspan><tspan x="1035.0" dy="21.6">Target distribution</tspan></text><rect x="450" y="315" width="170" height="80" rx="1" fill="#F8EDEC" stroke="#C00000" stroke-width="0.9"/><text x="535.0" y="341.0" text-anchor="middle" font-size="14" style="fill:#1D1D1A;font-weight:400"><tspan x="535.0" dy="0">Shallow Readout</tspan><tspan x="535.0" dy="18.900000000000002">Depth d &lt; T</tspan><tspan x="535.0" dy="18.900000000000002">LM Head → Top-k = 2</tspan></text><rect x="665" y="315" width="220" height="80" rx="1" fill="#F3F3F3" stroke="#999999" stroke-width="0.9"/><text x="775.0" y="341.0" text-anchor="middle" font-size="14" style="fill:#1D1D1A;font-weight:400"><tspan x="775.0" dy="0">Accept + Promote + Prune</tspan><tspan x="775.0" dy="18.900000000000002">Reuse H, KV, completed loops</tspan><tspan x="775.0" dy="18.900000000000002">Keep descendant subtree</tspan></text><rect x="930" y="315" width="210" height="80" rx="1" fill="#F3F3F3" stroke="#999999" stroke-width="0.9"/><text x="1035.0" y="340.0" text-anchor="middle" font-size="15" style="fill:#1D1D1A;font-weight:700"><tspan x="1035.0" dy="0">Committed Tokens</tspan><tspan x="1035.0" dy="20.25">One or more per step</tspan><tspan x="1035.0" dy="20.25">Output distribution preserved</tspan></text><polyline points="135,210.0 190,205.0" fill="none" stroke="#777777" stroke-width="1.1" marker-end="url(#arrow-01-1-0)"/><polyline points="405,205.0 450,205.0" fill="none" stroke="#C00000" stroke-width="1.1" marker-end="url(#arrow-01-1-1)"/><polyline points="620,205.0 665,200.0" fill="none" stroke="#777777" stroke-width="1.1" marker-end="url(#arrow-01-1-0)"/><polyline points="885,200.0 930,200.0" fill="none" stroke="#C00000" stroke-width="1.1" marker-end="url(#arrow-01-1-1)"/><polyline points="1035.0,260 1035.0,315" fill="none" stroke="#C00000" stroke-width="1.1" marker-end="url(#arrow-01-1-1)"/><polyline points="75.0,175 75,65 190,65.0" fill="none" stroke="#777777" stroke-width="1.1" marker-end="url(#arrow-01-1-0)"/><polyline points="297.5,110 297.5,160" fill="none" stroke="#777777" stroke-width="1.1" marker-end="url(#arrow-01-1-0)"/><text x="310" y="122" text-anchor="start" font-size="12" style="fill:#666666;font-weight:400"><tspan x="310" dy="0">frequency-weighted</tspan><tspan x="310" dy="16.200000000000003">drafts</tspan></text><polyline points="190,205.0 170,205 170,65 190,65.0" fill="none" stroke="#C00000" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arrow-01-1-1)"/><text x="162" y="135" text-anchor="end" font-size="12" style="fill:#C00000;font-weight:400"><tspan x="162" dy="0">re-query</tspan></text><polyline points="775.0,260 775,290 535,290 535.0,315" fill="none" stroke="#C00000" stroke-width="1.1" marker-end="url(#arrow-01-1-1)"/><text x="655" y="283" text-anchor="middle" font-size="13" style="fill:#C00000;font-weight:700"><tspan x="655" dy="0">H(d)</tspan></text><polyline points="450,355.0 425,355 425,290 297,290 297.5,250" fill="none" stroke="#C00000" stroke-width="1.1" stroke-dasharray="6 4" marker-end="url(#arrow-01-1-1)"/><text x="360" y="283" text-anchor="middle" font-size="12" style="fill:#C00000;font-weight:400"><tspan x="360" dy="0">Top-k candidates</tspan></text><polyline points="930,200.0 907,200 907,355 885,355.0